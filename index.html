<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>進階業績查詢系統 - iStore Taiwan</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft JhengHei", Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 30px 80px rgba(0,0,0,0.5);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #0f3460 0%, #16213e 100%);
            color: white;
            padding: 40px 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 38px;
            margin-bottom: 10px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .header p {
            opacity: 0.95;
            font-size: 16px;
            font-weight: 400;
            letter-spacing: 1.5px;
        }

        .filters-section {
            padding: 35px;
            background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
        }

        .section-title {
            font-size: 18px;
            font-weight: 700;
            color: #0f3460;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .filters-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 18px;
            margin-bottom: 25px;
        }

        .filter-group {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(15, 52, 96, 0.08);
            border: 2px solid #e8ecf1;
            transition: all 0.3s;
        }

        .filter-group:hover {
            box-shadow: 0 4px 20px rgba(15, 52, 96, 0.15);
            transform: translateY(-2px);
            border-color: #0ea5e9;
        }

        .filter-group label {
            display: block;
            font-weight: 700;
            color: #16213e;
            margin-bottom: 10px;
            font-size: 12px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .filter-group select,
        .filter-group input {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid #e0e6ed;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            transition: all 0.3s;
            background: #fafbfc;
            color: #2c3e50;
            font-weight: 500;
        }

        .filter-group select:focus,
        .filter-group input:focus {
            outline: none;
            border-color: #0ea5e9;
            background: white;
            box-shadow: 0 0 0 4px rgba(14, 165, 233, 0.1);
        }

        .date-range-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .date-input-wrapper {
            position: relative;
        }

        .date-display {
            background: #f0f9ff;
            border: 2px solid #bae6fd;
            border-radius: 8px;
            padding: 10px;
            margin-top: 8px;
            font-size: 12px;
            text-align: center;
            min-height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .date-display.weekend {
            color: #dc2626;
            font-weight: 700;
        }

        .date-display.holiday {
            background: #fee2e2;
            border-color: #fecaca;
            color: #dc2626;
            font-weight: 700;
        }

        .compare-section {
            background: white;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 25px;
            border: 2px solid #06b6d4;
            box-shadow: 0 2px 15px rgba(6, 182, 212, 0.1);
        }

        .compare-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 15px;
        }

        .compare-period {
            background: #f0fdfa;
            padding: 20px;
            border-radius: 10px;
            border: 2px solid #5eead4;
        }

        .compare-period h4 {
            font-size: 13px;
            font-weight: 700;
            color: #0f766e;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .compare-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .compare-inputs input {
            padding: 11px 12px;
            border: 2px solid #99f6e4;
            border-radius: 8px;
            font-size: 13px;
            background: white;
            color: #2c3e50;
            font-weight: 500;
        }

        .compare-inputs input:focus {
            outline: none;
            border-color: #14b8a6;
            box-shadow: 0 0 0 4px rgba(20, 184, 166, 0.1);
        }

        .action-buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 13px 30px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #0ea5e9 0%, #06b6d4 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(14, 165, 233, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(14, 165, 233, 0.4);
        }

        .btn-secondary {
            background: white;
            color: #0f3460;
            border: 2px solid #cbd5e1;
        }

        .btn-secondary:hover {
            background: #f8fafc;
            border-color: #0f3460;
        }

        .results-section {
            padding: 35px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            border-left: 5px solid;
            transition: all 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(0,0,0,0.12);
        }

        .stat-card.primary {
            border-left-color: #3b82f6;
        }

        .stat-card.success {
            border-left-color: #10b981;
        }

        .stat-card.warning {
            border-left-color: #f59e0b;
        }

        .stat-card.info {
            border-left-color: #06b6d4;
        }

        .stat-label {
            font-size: 13px;
            color: #64748b;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 32px;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 5px;
        }

        .stat-detail {
            font-size: 12px;
            color: #94a3b8;
            font-weight: 500;
        }

        /* 圖表區域 */
        .charts-section {
            margin: 30px 0;
        }

        .chart-container {
            background: white;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        }

        .chart-title {
            font-size: 17px;
            font-weight: 700;
            color: #0f3460;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .chart-canvas {
            max-height: 400px;
        }

        .table-container {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            margin-top: 20px;
        }

        .table-header {
            background: linear-gradient(135deg, #0f3460 0%, #16213e 100%);
            color: white;
            padding: 20px 25px;
        }

        .table-header h3 {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: #f8fafc;
        }

        thead th {
            padding: 15px 18px;
            text-align: left;
            font-weight: 700;
            font-size: 12px;
            color: #475569;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 2px solid #e2e8f0;
        }

        tbody tr {
            border-bottom: 1px solid #f1f5f9;
            transition: all 0.2s;
        }

        tbody tr:hover {
            background: #f8fafc;
        }

        tbody td {
            padding: 15px 18px;
            font-size: 14px;
            color: #334155;
            font-weight: 500;
        }

        .date-cell {
            font-family: 'Courier New', monospace;
        }

        .date-cell.weekend {
            color: #dc2626;
            font-weight: 700;
        }

        .date-cell.holiday {
            color: #dc2626;
            font-weight: 700;
            background: #fef2f2;
        }

        .number {
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        .positive {
            color: #10b981;
            font-weight: 600;
        }

        .negative {
            color: #ef4444;
            font-weight: 600;
        }

        .loading {
            text-align: center;
            padding: 50px;
            color: #64748b;
        }

        .loading-spinner {
            display: inline-block;
            width: 50px;
            height: 50px;
            border: 4px solid #e2e8f0;
            border-top-color: #0ea5e9;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .no-data {
            text-align: center;
            padding: 50px;
            color: #94a3b8;
            font-size: 16px;
        }

        /* 滾動提示預設隱藏 */
        .scroll-hint {
            display: none;
        }

        /* 響應式設計 - iPhone & iPad 優化 */
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }

            .container {
                border-radius: 16px;
            }

            .header {
                padding: 30px 20px;
            }

            .header h1 {
                font-size: 24px;
                margin-bottom: 8px;
            }

            .header p {
                font-size: 14px;
            }

            .filters-section {
                padding: 20px 15px;
            }

            .section-title {
                font-size: 16px;
                margin-bottom: 15px;
            }

            .filters-grid {
                grid-template-columns: 1fr;
                gap: 15px;
            }

            .filter-group {
                padding: 18px;
            }

            .filter-group label {
                font-size: 13px;
                margin-bottom: 8px;
            }

            .filter-group select,
            .filter-group input {
                padding: 14px 12px;
                font-size: 16px; /* 避免 iOS 自動縮放 */
            }

            .date-range-group {
                grid-template-columns: 1fr;
                gap: 12px;
            }

            .date-display {
                font-size: 13px;
                padding: 12px;
                min-height: 42px;
            }

            .compare-section {
                padding: 20px 15px;
                margin-bottom: 20px;
            }

            .compare-grid {
                grid-template-columns: 1fr;
                gap: 15px;
            }

            .compare-period {
                padding: 18px;
            }

            .compare-period h4 {
                font-size: 12px;
                margin-bottom: 10px;
            }

            .compare-inputs {
                grid-template-columns: 1fr;
                gap: 10px;
            }

            .compare-inputs input {
                padding: 14px 12px;
                font-size: 16px; /* 避免 iOS 自動縮放 */
            }

            .action-buttons {
                flex-direction: column;
                gap: 10px;
            }

            .btn {
                width: 100%;
                justify-content: center;
                padding: 16px 24px;
                font-size: 15px;
                min-height: 52px;
            }

            .results-section {
                padding: 20px 15px;
            }

            .stats-grid {
                grid-template-columns: 1fr;
                gap: 15px;
            }

            .stat-card {
                padding: 20px;
            }

            .stat-label {
                font-size: 12px;
            }

            .stat-value {
                font-size: 28px;
            }

            .stat-detail {
                font-size: 11px;
            }

            .charts-section {
                margin: 20px 0;
            }

            .chart-container {
                padding: 15px;
                margin-bottom: 15px;
            }

            .chart-title {
                font-size: 15px;
                margin-bottom: 15px;
            }

            .chart-canvas {
                max-height: 280px;
            }

            .table-container {
                border-radius: 12px;
                margin-top: 15px;
            }

            .table-header {
                padding: 18px 15px;
            }

            .table-header h3 {
                font-size: 16px;
            }

            /* 表格捲動容器 */
            .table-scroll-wrapper {
                overflow-x: auto;
                -webkit-overflow-scrolling: touch;
                scrollbar-width: thin;
                scrollbar-color: #cbd5e1 #f1f5f9;
            }

            .table-scroll-wrapper::-webkit-scrollbar {
                height: 8px;
            }

            .table-scroll-wrapper::-webkit-scrollbar-track {
                background: #f1f5f9;
                border-radius: 4px;
            }

            .table-scroll-wrapper::-webkit-scrollbar-thumb {
                background: #cbd5e1;
                border-radius: 4px;
            }

            .table-scroll-wrapper::-webkit-scrollbar-thumb:hover {
                background: #94a3b8;
            }

            table {
                min-width: 600px;
                font-size: 13px;
            }

            thead th {
                padding: 12px 10px;
                font-size: 11px;
                white-space: nowrap;
                position: sticky;
                top: 0;
                background: #f8fafc;
                z-index: 10;
            }

            tbody td {
                padding: 12px 10px;
                font-size: 13px;
            }

            .date-cell {
                font-size: 12px;
                white-space: nowrap;
            }

            .number {
                white-space: nowrap;
            }

            /* 滾動提示 */
            .scroll-hint {
                display: block;
                text-align: center;
                padding: 10px;
                background: #f8fafc;
                color: #64748b;
                font-size: 12px;
                border-top: 1px solid #e2e8f0;
                border-radius: 0 0 12px 12px;
            }

            .no-data {
                padding: 40px 20px;
                font-size: 15px;
            }
        }

        /* iPad 優化 (768px - 1024px) */
        @media (min-width: 769px) and (max-width: 1024px) {
            .container {
                max-width: 100%;
            }

            .header h1 {
                font-size: 32px;
            }

            .header p {
                font-size: 15px;
            }

            .filters-section {
                padding: 30px;
            }

            .filters-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 18px;
            }

            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .compare-grid {
                grid-template-columns: 1fr 1fr;
            }

            .chart-canvas {
                max-height: 350px;
            }

            table {
                font-size: 14px;
            }

            thead th {
                padding: 14px 15px;
                font-size: 12px;
            }

            tbody td {
                padding: 14px 15px;
                font-size: 14px;
            }
        }

        /* iPhone SE / 小螢幕 (max-width: 375px) */
        @media (max-width: 375px) {
            body {
                padding: 8px;
            }

            .header {
                padding: 25px 15px;
            }

            .header h1 {
                font-size: 20px;
            }

            .header p {
                font-size: 12px;
            }

            .filters-section,
            .results-section {
                padding: 15px 12px;
            }

            .filter-group {
                padding: 15px;
            }

            .stat-card {
                padding: 18px;
            }

            .stat-value {
                font-size: 24px;
            }

            .stat-label {
                font-size: 11px;
            }

            .btn {
                padding: 14px 20px;
                font-size: 14px;
            }

            .chart-container {
                padding: 12px;
            }

            .chart-canvas {
                max-height: 240px;
            }

            table {
                min-width: 500px;
                font-size: 12px;
            }

            thead th {
                padding: 10px 8px;
                font-size: 10px;
            }

            tbody td {
                padding: 10px 8px;
                font-size: 12px;
            }
        }

        /* 橫向模式優化 */
        @media (max-width: 768px) and (orientation: landscape) {
            .header {
                padding: 20px;
            }

            .header h1 {
                font-size: 22px;
            }

            .header p {
                font-size: 13px;
            }

            .filters-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .compare-grid {
                grid-template-columns: 1fr 1fr;
            }

            .chart-canvas {
                max-height: 220px;
            }
        }

        /* 觸控優化 */
        @media (hover: none) and (pointer: coarse) {
            /* 增加可觸控區域 */
            .btn {
                min-height: 52px;
            }

            select,
            input[type="date"] {
                min-height: 52px;
                font-size: 16px; /* 防止 iOS 縮放 */
            }

            /* 移除 hover 效果，使用 active 代替 */
            .filter-group:hover {
                transform: none;
                box-shadow: 0 2px 12px rgba(15, 52, 96, 0.08);
            }

            .filter-group:active {
                transform: scale(0.98);
                transition: transform 0.1s;
            }

            .btn-primary:hover {
                transform: none;
                box-shadow: 0 4px 15px rgba(14, 165, 233, 0.3);
            }

            .btn-primary:active {
                transform: scale(0.97);
                transition: transform 0.1s;
            }

            .stat-card:hover {
                transform: none;
            }

            .stat-card:active {
                transform: scale(0.98);
                transition: transform 0.1s;
            }

            tbody tr:hover {
                background: transparent;
            }

            tbody tr:active {
                background: #f8fafc;
            }

            /* 改善點擊反饋 */
            button:active {
                opacity: 0.8;
            }
        }

        /* iOS Safari 特定優化 */
        @supports (-webkit-touch-callout: none) {
            /* 修復 iOS 輸入框樣式 */
            input[type="date"] {
                -webkit-appearance: none;
                appearance: none;
                min-height: 52px;
            }

            select {
                -webkit-appearance: none;
                appearance: none;
                background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%230f3460' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
                background-repeat: no-repeat;
                background-position: right 12px center;
                background-size: 20px;
                padding-right: 40px;
            }

            /* 防止雙擊縮放 */
            * {
                touch-action: manipulation;
            }

            /* 平滑滾動 */
            .table-scroll-wrapper {
                -webkit-overflow-scrolling: touch;
            }
        }

        /* 新增淡入動畫 */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .fade-in {
            animation: fadeIn 0.5s ease-out;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 進階業績查詢系統</h1>
            <p>iStore | 全店業績分析平台</p>
        </div>

        <div class="filters-section">
            <div class="section-title">🔍 篩選條件</div>
            
            <div class="filters-grid">
                <div class="filter-group">
                    <label>年份</label>
                    <select id="yearFilter">
                        <option value="">全部年份</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label>月份</label>
                    <select id="monthFilter">
                        <option value="">全部月份</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label>店別</label>
                    <select id="storeFilter">
                        <option value="">全部店別</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label>日期範圍</label>
                    <div class="date-range-group">
                        <div class="date-input-wrapper">
                            <input type="date" id="startDate" placeholder="開始日期">
                            <div class="date-display" id="startDateDisplay">未選擇</div>
                        </div>
                        <div class="date-input-wrapper">
                            <input type="date" id="endDate" placeholder="結束日期">
                            <div class="date-display" id="endDateDisplay">未選擇</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 區間比較功能 -->
            <div class="compare-section">
                <div class="section-title">📈 區間比較分析</div>
                
                <div style="margin-bottom: 15px;">
                    <div class="filter-group" style="max-width: 400px;">
                        <label>比較店別（可選）</label>
                        <select id="compareStore">
                            <option value="">全部店別</option>
                        </select>
                    </div>
                </div>
                
                <div class="compare-grid">
                    <div class="compare-period">
                        <h4>基準期間</h4>
                        <div class="compare-inputs">
                            <input type="date" id="baseStart" placeholder="開始日期">
                            <input type="date" id="baseEnd" placeholder="結束日期">
                        </div>
                        <div class="date-display" id="baseDisplay" style="margin-top: 10px;">未選擇</div>
                    </div>
                    <div class="compare-period">
                        <h4>比較期間</h4>
                        <div class="compare-inputs">
                            <input type="date" id="compareStart" placeholder="開始日期">
                            <input type="date" id="compareEnd" placeholder="結束日期">
                        </div>
                        <div class="date-display" id="compareDisplay" style="margin-top: 10px;">未選擇</div>
                    </div>
                </div>
            </div>

            <div class="action-buttons">
                <button class="btn btn-primary" onclick="applyFilters()">
                    <span>🔍</span>
                    <span>套用篩選</span>
                </button>
                <button class="btn btn-secondary" onclick="resetFilters()">
                    <span>🔄</span>
                    <span>重置</span>
                </button>
                <button class="btn btn-primary" onclick="compareIntervals()">
                    <span>📊</span>
                    <span>區間對比</span>
                </button>
            </div>
        </div>

        <div class="results-section">
            <div id="statsContainer"></div>
            <div id="chartsContainer"></div>
            <div id="tableContainer"></div>
        </div>
    </div>

    <script>
        // 台灣國定假日 2024-2025
        const holidays = {
            '2024-01-01': '元旦',
            '2024-02-08': '小年夜',
            '2024-02-09': '除夕',
            '2024-02-10': '春節',
            '2024-02-11': '春節',
            '2024-02-12': '春節',
            '2024-02-13': '春節',
            '2024-02-14': '春節',
            '2024-02-28': '和平紀念日',
            '2024-04-04': '兒童節',
            '2024-04-05': '清明節',
            '2024-06-10': '端午節',
            '2024-09-17': '中秋節',
            '2024-10-10': '國慶日',
            '2025-01-01': '元旦',
            '2025-01-27': '小年夜',
            '2025-01-28': '除夕',
            '2025-01-29': '春節',
            '2025-01-30': '春節',
            '2025-01-31': '春節',
            '2025-02-01': '春節',
            '2025-02-02': '春節',
            '2025-02-28': '和平紀念日',
            '2025-04-03': '兒童節',
            '2025-04-04': '清明節',
            '2025-05-31': '端午節',
            '2025-10-06': '中秋節',
            '2025-10-10': '國慶日'
        };

        // 店別對照表
        const storeMapping = {
            'NK[i]store': { name: '南西', order: 45 },
            'TM[i]store': { name: '天母', order: 47 },
            'MS[i]store': { name: '站前', order: 48 },
            'SYA11[i]store': { name: 'A11', order: 51 },
            'A4[i]store': { name: 'A4', order: 57 },
            'DZ[i]store': { name: '大直', order: 59 },
            'QP[i]store': { name: '青埔', order: 61 },
            'TY[i]store': { name: '桃站', order: 65 },
            'TC[i]store': { name: '中港', order: 75 },
            '中友[i]store': { name: '中友', order: 76 },
            'MOP台中[i]store': { name: '台中三井', order: 77 },
            '耐斯[i]store': { name: '耐斯', order: 81 },
            '垂楊[i]store': { name: '垂楊', order: 84 },
            '西門[i]store': { name: '西門', order: 86 },
            '中山[i]store': { name: '中山', order: 88 },
            'MTN[i]store': { name: '台南三井', order: 89 },
            'XBM[i]store': { name: '小北門', order: 97 },
            'ZU[i]store': { name: '左營', order: 115 },
            '三多[i]store': { name: '三多', order: 116 },
            'SP[i]store': { name: 'SKM Park', order: 117 }
        };

        let allData = [];
        let filteredData = [];
        let charts = {};

        // 取得星期幾
        function getWeekday(dateString) {
            const weekdays = ['日', '一', '二', '三', '四', '五', '六'];
            const date = new Date(dateString);
            return weekdays[date.getDay()];
        }

        // 判斷是否為週末
        function isWeekend(dateString) {
            const date = new Date(dateString);
            const day = date.getDay();
            return day === 0 || day === 6;
        }

        // 判斷是否為假日
        function isHoliday(dateString) {
            return holidays.hasOwnProperty(dateString);
        }

        // 格式化日期顯示（含星期）
        function formatDateWithWeekday(dateString) {
            if (!dateString) return '未選擇';
            const weekday = getWeekday(dateString);
            const holiday = holidays[dateString];
            const isSpecialDay = isWeekend(dateString) || holiday;
            
            let display = `${dateString} (${weekday})`;
            if (holiday) {
                display += ` [${holiday}]`;
            }
            
            return { display, isSpecialDay, isHoliday: !!holiday };
        }

        // 更新日期顯示
        function updateDateDisplay(inputId, displayId) {
            const input = document.getElementById(inputId);
            const display = document.getElementById(displayId);
            
            if (input.value) {
                const formatted = formatDateWithWeekday(input.value);
                display.textContent = formatted.display;
                display.classList.remove('weekend', 'holiday');
                
                if (formatted.isHoliday) {
                    display.classList.add('holiday');
                } else if (formatted.isSpecialDay) {
                    display.classList.add('weekend');
                }
            } else {
                display.textContent = '未選擇';
                display.classList.remove('weekend', 'holiday');
            }
        }

        // 更新比較期間顯示
        function updateCompareDisplay(startId, endId, displayId) {
            const start = document.getElementById(startId).value;
            const end = document.getElementById(endId).value;
            const display = document.getElementById(displayId);
            
            if (start && end) {
                const startFormatted = formatDateWithWeekday(start);
                const endFormatted = formatDateWithWeekday(end);
                display.innerHTML = `${startFormatted.display}<br>~<br>${endFormatted.display}`;
                
                if (startFormatted.isHoliday || endFormatted.isHoliday) {
                    display.classList.add('holiday');
                } else if (startFormatted.isSpecialDay || endFormatted.isSpecialDay) {
                    display.classList.add('weekend');
                } else {
                    display.classList.remove('weekend', 'holiday');
                }
            } else if (start) {
                const formatted = formatDateWithWeekday(start);
                display.textContent = `開始：${formatted.display}`;
            } else if (end) {
                const formatted = formatDateWithWeekday(end);
                display.textContent = `結束：${formatted.display}`;
            } else {
                display.textContent = '未選擇';
                display.classList.remove('weekend', 'holiday');
            }
        }

        // 自動載入JSON資料
        async function loadJSON() {
            const url = 'data/salesData.json';
            
            try {
                const response = await fetch(url);
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const data = await response.json();
                
                allData = data.map(item => {
                    const storeInfo = Object.values(storeMapping).find(s => s.name === item.店別);
                    return {
                        ...item,
                        店別順序: storeInfo ? storeInfo.order : 999
                    };
                });

                filteredData = [...allData];
                
                console.log(`✅ 成功載入 ${allData.length.toLocaleString()} 筆資料`);
                
                initializeFilters();
                setupDateListeners();
                applyFilters();
                
            } catch (error) {
                alert(`❌ 載入資料失敗: ${error.message}\n\n請確認 data/salesData.json 檔案存在`);
                console.error('載入JSON失敗:', error);
            }
        }

        // 設定日期監聽器
        function setupDateListeners() {
            // 主要篩選的日期
            document.getElementById('startDate').addEventListener('change', function() {
                updateDateDisplay('startDate', 'startDateDisplay');
            });
            
            document.getElementById('endDate').addEventListener('change', function() {
                updateDateDisplay('endDate', 'endDateDisplay');
            });

            // 比較期間的日期
            const baseStart = document.getElementById('baseStart');
            const baseEnd = document.getElementById('baseEnd');
            const compareStart = document.getElementById('compareStart');
            const compareEnd = document.getElementById('compareEnd');

            baseStart.addEventListener('change', () => updateCompareDisplay('baseStart', 'baseEnd', 'baseDisplay'));
            baseEnd.addEventListener('change', () => updateCompareDisplay('baseStart', 'baseEnd', 'baseDisplay'));
            compareStart.addEventListener('change', () => updateCompareDisplay('compareStart', 'compareEnd', 'compareDisplay'));
            compareEnd.addEventListener('change', () => updateCompareDisplay('compareStart', 'compareEnd', 'compareDisplay'));

            // 設定日期範圍
            if (allData.length > 0) {
                const dates = allData.map(d => d.完整日期).sort();
                const minDate = dates[0];
                const maxDate = dates[dates.length - 1];

                [baseStart, baseEnd, compareStart, compareEnd, 
                 document.getElementById('startDate'), document.getElementById('endDate')].forEach(input => {
                    input.min = minDate;
                    input.max = maxDate;
                });
            }
        }

        // 初始化篩選器選項
        function initializeFilters() {
            // 年份
            const years = [...new Set(allData.map(d => d.年份))].sort((a, b) => b - a);
            const yearFilter = document.getElementById('yearFilter');
            yearFilter.innerHTML = '<option value="">全部年份</option>';
            years.forEach(year => {
                yearFilter.innerHTML += `<option value="${year}">${year}年</option>`;
            });

            // 月份
            const monthFilter = document.getElementById('monthFilter');
            monthFilter.innerHTML = '<option value="">全部月份</option>';
            for (let i = 1; i <= 12; i++) {
                monthFilter.innerHTML += `<option value="${i}">${i}月</option>`;
            }

            // 店別
            const stores = [...new Set(allData.map(d => d.店別))]
                .map(store => {
                    const storeInfo = Object.values(storeMapping).find(s => s.name === store);
                    return {
                        name: store,
                        order: storeInfo ? storeInfo.order : 999
                    };
                })
                .sort((a, b) => a.order - b.order);

            const storeFilter = document.getElementById('storeFilter');
            storeFilter.innerHTML = '<option value="">全部店別</option>';
            stores.forEach(store => {
                storeFilter.innerHTML += `<option value="${store.name}">${store.name}</option>`;
            });

            const compareStoreFilter = document.getElementById('compareStore');
            compareStoreFilter.innerHTML = '<option value="">全部店別</option>';
            stores.forEach(store => {
                compareStoreFilter.innerHTML += `<option value="${store.name}">${store.name}</option>`;
            });
        }

        // 套用篩選
        function applyFilters() {
            const year = document.getElementById('yearFilter').value;
            const month = document.getElementById('monthFilter').value;
            const store = document.getElementById('storeFilter').value;
            const startDate = document.getElementById('startDate').value;
            const endDate = document.getElementById('endDate').value;

            filteredData = allData.filter(item => {
                if (year && item.年份 != year) return false;
                if (month && item.月份數字 != month) return false;
                if (store && item.店別 !== store) return false;
                if (startDate && item.完整日期 < startDate) return false;
                if (endDate && item.完整日期 > endDate) return false;
                return true;
            });

            displayResults();
        }

        // 重置篩選
        function resetFilters() {
            document.getElementById('yearFilter').value = '';
            document.getElementById('monthFilter').value = '';
            document.getElementById('storeFilter').value = '';
            document.getElementById('startDate').value = '';
            document.getElementById('endDate').value = '';
            document.getElementById('baseStart').value = '';
            document.getElementById('baseEnd').value = '';
            document.getElementById('compareStart').value = '';
            document.getElementById('compareEnd').value = '';
            document.getElementById('compareStore').value = '';
            
            updateDateDisplay('startDate', 'startDateDisplay');
            updateDateDisplay('endDate', 'endDateDisplay');
            updateCompareDisplay('baseStart', 'baseEnd', 'baseDisplay');
            updateCompareDisplay('compareStart', 'compareEnd', 'compareDisplay');
            
            filteredData = [...allData];
            displayResults();
        }

        // 顯示結果
        function displayResults() {
            if (filteredData.length === 0) {
                document.getElementById('statsContainer').innerHTML = '';
                document.getElementById('chartsContainer').innerHTML = '';
                document.getElementById('tableContainer').innerHTML = '<div class="no-data">📭 無符合條件的資料</div>';
                return;
            }

            // 計算統計數據
            const totalSales = filteredData.reduce((sum, item) => sum + item.業績, 0);
            const uniqueStores = new Set(filteredData.map(d => d.店別));
            const uniqueDates = new Set(filteredData.map(d => d.完整日期));
            
            // 每日平均 = 總業績 / (天數 * 店別數)
            const avgPerDay = Math.round(totalSales / (uniqueDates.size * uniqueStores.size));
            
            const maxSale = Math.max(...filteredData.map(d => d.業績));
            const maxSaleItem = filteredData.find(d => d.業績 === maxSale);

            // 顯示統計卡片
            document.getElementById('statsContainer').innerHTML = `
                <div class="stats-grid fade-in">
                    <div class="stat-card primary">
                        <div class="stat-label">總業績</div>
                        <div class="stat-value">NT$ ${totalSales.toLocaleString()}</div>
                        <div class="stat-detail">共 ${filteredData.length.toLocaleString()} 筆資料</div>
                    </div>
                    <div class="stat-card success">
                        <div class="stat-label">每日平均</div>
                        <div class="stat-value">NT$ ${avgPerDay.toLocaleString()}</div>
                        <div class="stat-detail">${uniqueDates.size} 天 × ${uniqueStores.size} 店</div>
                    </div>
                    <div class="stat-card warning">
                        <div class="stat-label">最高單日</div>
                        <div class="stat-value">NT$ ${maxSale.toLocaleString()}</div>
                        <div class="stat-detail">${maxSaleItem.店別} - ${maxSaleItem.完整日期}</div>
                    </div>
                    <div class="stat-card info">
                        <div class="stat-label">店別數量</div>
                        <div class="stat-value">${uniqueStores.size}</div>
                        <div class="stat-detail">個店別</div>
                    </div>
                </div>
            `;

            // 顯示圖表
            displayCharts();

            // 按日期排序
            const sortedData = [...filteredData].sort((a, b) => a.完整日期.localeCompare(b.完整日期));

            // 顯示表格
            let tableHTML = `
                <div class="table-container fade-in">
                    <div class="table-header">
                        <h3>📋 每日業績明細</h3>
                    </div>
                    <div class="table-scroll-wrapper">
                        <table>
                            <thead>
                                <tr>
                                    <th>日期</th>
                                    <th>星期</th>
                                    <th>店別</th>
                                    <th class="number">業績</th>
                                    <th class="number">占比</th>
                                </tr>
                            </thead>
                            <tbody>
            `;

            sortedData.forEach((item) => {
                const percentage = ((item.業績 / totalSales) * 100).toFixed(2);
                const weekday = getWeekday(item.完整日期);
                const holiday = holidays[item.完整日期];
                const isSpecial = isWeekend(item.完整日期) || holiday;
                const dateClass = holiday ? 'holiday' : (isSpecial ? 'weekend' : '');
                
                tableHTML += `
                    <tr>
                        <td class="date-cell ${dateClass}">${item.完整日期}</td>
                        <td class="date-cell ${dateClass}">${weekday}${holiday ? ' [' + holiday + ']' : ''}</td>
                        <td><strong>${item.店別}</strong></td>
                        <td class="number">NT$ ${item.業績.toLocaleString()}</td>
                        <td class="number">${percentage}%</td>
                    </tr>
                `;
            });

            tableHTML += `
                            </tbody>
                            <tfoot>
                                <tr style="background: #f8fafc; font-weight: 700; border-top: 3px solid #0f3460;">
                                    <td colspan="3" style="text-align: right; padding-right: 20px;">總計</td>
                                    <td class="number" style="color: #0f3460; font-size: 16px;">NT$ ${totalSales.toLocaleString()}</td>
                                    <td class="number" style="color: #0f3460;">100.00%</td>
                                </tr>
                            </tfoot>
                        </table>
                    </div>
                    <div class="scroll-hint">← 左右滑動查看更多 →</div>
                </div>
            `;

            document.getElementById('tableContainer').innerHTML = tableHTML;
        }

        // 顯示圖表
        function displayCharts() {
            // 清除舊圖表
            Object.values(charts).forEach(chart => chart.destroy());
            charts = {};

            const chartsContainer = document.getElementById('chartsContainer');
            chartsContainer.innerHTML = `
                <div class="charts-section fade-in">
                    <div class="chart-container">
                        <div class="chart-title">
                            <span>📈</span>
                            <span>每日業績趨勢</span>
                        </div>
                        <canvas id="dailyTrendChart" class="chart-canvas"></canvas>
                    </div>

                    <div class="chart-container">
                        <div class="chart-title">
                            <span>🏪</span>
                            <span>店別業績排名</span>
                        </div>
                        <canvas id="storeRankingChart" class="chart-canvas"></canvas>
                    </div>
                </div>
            `;

            createDailyTrendChart();
            createStoreRankingChart();
        }

        // 每日趨勢圖
        function createDailyTrendChart() {
            const ctx = document.getElementById('dailyTrendChart');
            
            const dailyData = {};
            filteredData.forEach(record => {
                const date = record.完整日期;
                if (!dailyData[date]) {
                    dailyData[date] = 0;
                }
                dailyData[date] += record.業績;
            });
            
            const sortedDates = Object.keys(dailyData).sort();
            const values = sortedDates.map(date => dailyData[date]);
            
            charts.dailyTrend = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: sortedDates.map(date => {
                        const d = new Date(date);
                        const weekday = getWeekday(date);
                        return `${d.getMonth() + 1}/${d.getDate()} (${weekday})`;
                    }),
                    datasets: [{
                        label: '每日總業績',
                        data: values,
                        borderColor: '#0ea5e9',
                        backgroundColor: 'rgba(14, 165, 233, 0.1)',
                        tension: 0.4,
                        fill: true,
                        pointBackgroundColor: sortedDates.map(date => {
                            if (isHoliday(date)) return '#dc2626';
                            if (isWeekend(date)) return '#f87171';
                            return '#0ea5e9';
                        }),
                        pointRadius: 4,
                        pointHoverRadius: 6
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: {
                        legend: {
                            display: true,
                            position: 'top'
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    const date = sortedDates[context.dataIndex];
                                    const weekday = getWeekday(date);
                                    const holiday = holidays[date];
                                    return [
                                        `日期: ${date} (${weekday})${holiday ? ' [' + holiday + ']' : ''}`,
                                        `業績: ${context.parsed.y.toLocaleString()} 元`
                                    ];
                                }
                            }
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: {
                                callback: function(value) {
                                    return (value / 1000000).toFixed(1) + 'M';
                                }
                            }
                        },
                        x: {
                            ticks: {
                                maxRotation: 45,
                                minRotation: 45
                            }
                        }
                    }
                }
            });
        }

        // 店別排名圖
        function createStoreRankingChart() {
            const ctx = document.getElementById('storeRankingChart');
            
            const storeData = {};
            filteredData.forEach(record => {
                const store = record.店別;
                if (!storeData[store]) {
                    storeData[store] = 0;
                }
                storeData[store] += record.業績;
            });
            
            const stores = Object.keys(storeData).sort((a, b) => storeData[b] - storeData[a]);
            const values = stores.map(store => storeData[store]);
            
            const colors = stores.map((_, i) => {
                const hue = (i * 360 / stores.length);
                return `hsla(${hue}, 70%, 60%, 0.8)`;
            });
            
            charts.storeRanking = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: stores,
                    datasets: [{
                        label: '總業績',
                        data: values,
                        backgroundColor: colors,
                        borderColor: colors.map(c => c.replace('0.8', '1')),
                        borderWidth: 2
                    }]
                },
                options: {
                    indexAxis: 'y',
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: {
                        legend: {
                            display: false
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    const total = values.reduce((a, b) => a + b, 0);
                                    const percentage = ((context.parsed.x / total) * 100).toFixed(1);
                                    return [
                                        `業績: ${context.parsed.x.toLocaleString()} 元`,
                                        `佔比: ${percentage}%`
                                    ];
                                }
                            }
                        }
                    },
                    scales: {
                        x: {
                            beginAtZero: true,
                            ticks: {
                                callback: function(value) {
                                    return (value / 1000000).toFixed(0) + 'M';
                                }
                            }
                        }
                    }
                }
            });
        }

        // 比較趨勢圖表
        function createComparisonTrendChart(baseData, compareData, storeName) {
            const ctx = document.getElementById('comparisonTrendChart');
            
            // 將資料按日期彙總（每日總和）
            const baseDailyData = {};
            baseData.forEach(record => {
                const date = record.完整日期;
                if (!baseDailyData[date]) {
                    baseDailyData[date] = 0;
                }
                baseDailyData[date] += record.業績;
            });
            
            const compareDailyData = {};
            compareData.forEach(record => {
                const date = record.完整日期;
                if (!compareDailyData[date]) {
                    compareDailyData[date] = 0;
                }
                compareDailyData[date] += record.業績;
            });
            
            // 排序日期
            const baseDates = Object.keys(baseDailyData).sort();
            const compareDates = Object.keys(compareDailyData).sort();
            
            // 使用較長的天數作為X軸長度
            const maxLength = Math.max(baseDates.length, compareDates.length);
            const dayLabels = [];
            for (let i = 1; i <= maxLength; i++) {
                dayLabels.push(`第${i}天`);
            }
            
            // 準備資料
            const baseValues = baseDates.map(date => baseDailyData[date]);
            const compareValues = compareDates.map(date => compareDailyData[date]);
            
            // 補齊長度（較短的期間補 null）
            while (baseValues.length < maxLength) {
                baseValues.push(null);
            }
            while (compareValues.length < maxLength) {
                compareValues.push(null);
            }
            
            charts.comparisonTrend = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: dayLabels,
                    datasets: [
                        {
                            label: '基準期間',
                            data: baseValues,
                            borderColor: '#3b82f6',
                            backgroundColor: 'rgba(59, 130, 246, 0.1)',
                            tension: 0.4,
                            fill: false,
                            pointBackgroundColor: baseDates.map(date => {
                                if (isHoliday(date)) return '#dc2626';
                                if (isWeekend(date)) return '#f87171';
                                return '#3b82f6';
                            }),
                            pointRadius: 5,
                            pointHoverRadius: 7,
                            borderWidth: 3
                        },
                        {
                            label: '比較期間',
                            data: compareValues,
                            borderColor: '#10b981',
                            backgroundColor: 'rgba(16, 185, 129, 0.1)',
                            tension: 0.4,
                            fill: false,
                            pointBackgroundColor: compareDates.map(date => {
                                if (isHoliday(date)) return '#dc2626';
                                if (isWeekend(date)) return '#f87171';
                                return '#10b981';
                            }),
                            pointRadius: 5,
                            pointHoverRadius: 7,
                            borderWidth: 3
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    interaction: {
                        mode: 'index',
                        intersect: false
                    },
                    plugins: {
                        legend: {
                            display: true,
                            position: 'top',
                            labels: {
                                font: {
                                    size: 14,
                                    weight: 'bold'
                                },
                                padding: 20,
                                usePointStyle: true
                            }
                        },
                        tooltip: {
                            backgroundColor: 'rgba(0, 0, 0, 0.8)',
                            padding: 12,
                            titleFont: {
                                size: 14,
                                weight: 'bold'
                            },
                            bodyFont: {
                                size: 13
                            },
                            callbacks: {
                                title: function(context) {
                                    const dayIndex = context[0].dataIndex;
                                    return `第 ${dayIndex + 1} 天比較`;
                                },
                                label: function(context) {
                                    const dayIndex = context.dataIndex;
                                    const isBase = context.datasetIndex === 0;
                                    const dates = isBase ? baseDates : compareDates;
                                    
                                    if (dayIndex >= dates.length || context.parsed.y === null) {
                                        return null;
                                    }
                                    
                                    const date = dates[dayIndex];
                                    const weekday = getWeekday(date);
                                    const holiday = holidays[date];
                                    const label = isBase ? '基準期間' : '比較期間';
                                    
                                    return [
                                        `${label}: ${date} (${weekday})${holiday ? ' [' + holiday + ']' : ''}`,
                                        `業績: NT$ ${context.parsed.y.toLocaleString()}`
                                    ];
                                },
                                afterLabel: function(context) {
                                    const dayIndex = context.dataIndex;
                                    
                                    // 計算差異（只在兩個期間都有資料時顯示）
                                    if (baseValues[dayIndex] !== null && compareValues[dayIndex] !== null) {
                                        const diff = compareValues[dayIndex] - baseValues[dayIndex];
                                        const diffPercent = ((diff / baseValues[dayIndex]) * 100).toFixed(1);
                                        const sign = diff >= 0 ? '+' : '';
                                        return `差異: ${sign}${diff.toLocaleString()} (${sign}${diffPercent}%)`;
                                    }
                                    return null;
                                }
                            }
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: {
                                callback: function(value) {
                                    return 'NT$ ' + (value / 1000000).toFixed(1) + 'M';
                                },
                                font: {
                                    size: 12
                                }
                            },
                            grid: {
                                color: 'rgba(0, 0, 0, 0.05)'
                            }
                        },
                        x: {
                            ticks: {
                                font: {
                                    size: 11
                                },
                                maxRotation: 0,
                                minRotation: 0,
                                autoSkip: true,
                                maxTicksLimit: 15
                            },
                            grid: {
                                display: false
                            }
                        }
                    }
                }
            });
        }

        // 區間比較功能
        function compareIntervals() {
            const baseStart = document.getElementById('baseStart').value;
            const baseEnd = document.getElementById('baseEnd').value;
            const compareStart = document.getElementById('compareStart').value;
            const compareEnd = document.getElementById('compareEnd').value;
            const compareStore = document.getElementById('compareStore').value;

            if (!baseStart || !baseEnd || !compareStart || !compareEnd) {
                alert('請輸入完整的比較期間');
                return;
            }

            let baseData = allData.filter(item => 
                item.完整日期 >= baseStart && item.完整日期 <= baseEnd
            );

            let compareData = allData.filter(item => 
                item.完整日期 >= compareStart && item.完整日期 <= compareEnd
            );

            if (compareStore) {
                baseData = baseData.filter(item => item.店別 === compareStore);
                compareData = compareData.filter(item => item.店別 === compareStore);
            }

            if (baseData.length === 0 || compareData.length === 0) {
                alert('選擇的期間沒有資料');
                return;
            }

            const baseTotalSales = baseData.reduce((sum, item) => sum + item.業績, 0);
            const compareTotalSales = compareData.reduce((sum, item) => sum + item.業績, 0);
            const growthRate = ((compareTotalSales - baseTotalSales) / baseTotalSales * 100).toFixed(2);

            if (compareStore) {
                displaySingleStoreComparison(baseData, compareData, baseStart, baseEnd, compareStart, compareEnd, compareStore, baseTotalSales, compareTotalSales, growthRate);
            } else {
                displayAllStoresComparison(baseData, compareData, baseStart, baseEnd, compareStart, compareEnd, baseTotalSales, compareTotalSales, growthRate);
            }
        }

        // 顯示單一店別比較
        function displaySingleStoreComparison(baseData, compareData, baseStart, baseEnd, compareStart, compareEnd, storeName, baseTotalSales, compareTotalSales, growthRate) {
            const diff = compareTotalSales - baseTotalSales;
            const growthClass = parseFloat(growthRate) >= 0 ? 'positive' : 'negative';

            const baseSorted = [...baseData].sort((a, b) => a.完整日期.localeCompare(b.完整日期));
            const compareSorted = [...compareData].sort((a, b) => a.完整日期.localeCompare(b.完整日期));

            let compareHTML = `
                <div class="stats-grid fade-in">
                    <div class="stat-card primary">
                        <div class="stat-label">店別</div>
                        <div class="stat-value">${storeName}</div>
                        <div class="stat-detail">單店別比較</div>
                    </div>
                    <div class="stat-card info">
                        <div class="stat-label">基準期間</div>
                        <div class="stat-value">NT$ ${baseTotalSales.toLocaleString()}</div>
                        <div class="stat-detail">${baseStart} ~ ${baseEnd} (${baseData.length}天)</div>
                    </div>
                    <div class="stat-card info">
                        <div class="stat-label">比較期間</div>
                        <div class="stat-value">NT$ ${compareTotalSales.toLocaleString()}</div>
                        <div class="stat-detail">${compareStart} ~ ${compareEnd} (${compareData.length}天)</div>
                    </div>
                    <div class="stat-card ${parseFloat(growthRate) >= 0 ? 'success' : 'warning'}">
                        <div class="stat-label">成長率</div>
                        <div class="stat-value ${growthClass}">${growthRate}%</div>
                        <div class="stat-detail ${growthClass}">差額: NT$ ${diff.toLocaleString()}</div>
                    </div>
                </div>
            `;

            document.getElementById('statsContainer').innerHTML = compareHTML;
            
            // 新增比較趨勢圖表
            document.getElementById('chartsContainer').innerHTML = `
                <div class="charts-section fade-in" style="margin-top: 30px;">
                    <div class="chart-container">
                        <div class="chart-title">
                            <span>📈</span>
                            <span>${storeName} - 每日業績趨勢比較</span>
                        </div>
                        <canvas id="comparisonTrendChart" class="chart-canvas"></canvas>
                    </div>
                </div>
            `;
            
            createComparisonTrendChart(baseSorted, compareSorted, storeName);
            
            // 表格部分
            let tableHTML = `
                <div class="table-container fade-in" style="margin-top: 30px;">
                    <div class="table-header">
                        <h3>${storeName} - 每日業績明細比較</h3>
                    </div>
                    <div class="table-scroll-wrapper">
                        <table>
                            <thead>
                                <tr>
                                    <th colspan="3" style="text-align: center; background: #e0f2fe;">基準期間</th>
                                    <th colspan="3" style="text-align: center; background: #dbeafe;">比較期間</th>
                                </tr>
                                <tr>
                                    <th>日期</th>
                                    <th>星期</th>
                                    <th class="number">業績</th>
                                    <th>日期</th>
                                    <th>星期</th>
                                    <th class="number">業績</th>
                                </tr>
                            </thead>
                            <tbody>
            `;

            const maxLength = Math.max(baseSorted.length, compareSorted.length);
            for (let i = 0; i < maxLength; i++) {
                const baseItem = baseSorted[i];
                const compareItem = compareSorted[i];
                
                const baseWeekday = baseItem ? getWeekday(baseItem.完整日期) : '';
                const compareWeekday = compareItem ? getWeekday(compareItem.完整日期) : '';
                
                const baseClass = baseItem && (isHoliday(baseItem.完整日期) || isWeekend(baseItem.完整日期)) ? 'weekend' : '';
                const compareClass = compareItem && (isHoliday(compareItem.完整日期) || isWeekend(compareItem.完整日期)) ? 'weekend' : '';
                
                tableHTML += `
                    <tr>
                        <td class="date-cell ${baseClass}">${baseItem ? baseItem.完整日期 : '-'}</td>
                        <td class="date-cell ${baseClass}">${baseWeekday}</td>
                        <td class="number">${baseItem ? 'NT$ ' + baseItem.業績.toLocaleString() : '-'}</td>
                        <td class="date-cell ${compareClass}">${compareItem ? compareItem.完整日期 : '-'}</td>
                        <td class="date-cell ${compareClass}">${compareWeekday}</td>
                        <td class="number">${compareItem ? 'NT$ ' + compareItem.業績.toLocaleString() : '-'}</td>
                    </tr>
                `;
            }

            tableHTML += `
                            </tbody>
                        </table>
                    </div>
                    <div class="scroll-hint">← 左右滑動查看更多 →</div>
                </div>
            `;

            document.getElementById('tableContainer').innerHTML = tableHTML;
        }

        // 顯示所有店別比較
        function displayAllStoresComparison(baseData, compareData, baseStart, baseEnd, compareStart, compareEnd, baseTotalSales, compareTotalSales, growthRate) {
            const baseStoreStats = {};
            const compareStoreStats = {};

            baseData.forEach(item => {
                if (!baseStoreStats[item.店別]) baseStoreStats[item.店別] = 0;
                baseStoreStats[item.店別] += item.業績;
            });

            compareData.forEach(item => {
                if (!compareStoreStats[item.店別]) compareStoreStats[item.店別] = 0;
                compareStoreStats[item.店別] += item.業績;
            });

            const allStores = [...new Set([...Object.keys(baseStoreStats), ...Object.keys(compareStoreStats)])];
            const comparisonData = allStores.map(store => {
                const baseValue = baseStoreStats[store] || 0;
                const compareValue = compareStoreStats[store] || 0;
                const growth = baseValue > 0 ? ((compareValue - baseValue) / baseValue * 100).toFixed(2) : 0;
                const storeInfo = Object.values(storeMapping).find(s => s.name === store);
                
                return {
                    store,
                    baseValue,
                    compareValue,
                    growth: parseFloat(growth),
                    order: storeInfo ? storeInfo.order : 999
                };
            }).sort((a, b) => b.growth - a.growth);

            let compareHTML = `
                <div class="stats-grid fade-in">
                    <div class="stat-card primary">
                        <div class="stat-label">基準期間</div>
                        <div class="stat-value">NT$ ${baseTotalSales.toLocaleString()}</div>
                        <div class="stat-detail">${baseStart} ~ ${baseEnd}</div>
                    </div>
                    <div class="stat-card info">
                        <div class="stat-label">比較期間</div>
                        <div class="stat-value">NT$ ${compareTotalSales.toLocaleString()}</div>
                        <div class="stat-detail">${compareStart} ~ ${compareEnd}</div>
                    </div>
                    <div class="stat-card ${parseFloat(growthRate) >= 0 ? 'success' : 'warning'}">
                        <div class="stat-label">成長率</div>
                        <div class="stat-value ${parseFloat(growthRate) >= 0 ? 'positive' : 'negative'}">${growthRate}%</div>
                        <div class="stat-detail">總業績變化</div>
                    </div>
                    <div class="stat-card info">
                        <div class="stat-label">店別數</div>
                        <div class="stat-value">${allStores.length}</div>
                        <div class="stat-detail">個店別</div>
                    </div>
                </div>
                <div class="table-container fade-in" style="margin-top: 30px;">
                    <div class="table-header">
                        <h3>店別成長率比較</h3>
                    </div>
                    <div class="table-scroll-wrapper">
                        <table>
                            <thead>
                                <tr>
                                    <th>店別</th>
                                    <th class="number">基準期間</th>
                                    <th class="number">比較期間</th>
                                    <th class="number">成長金額</th>
                                    <th class="number">成長率</th>
                                </tr>
                            </thead>
                            <tbody>
            `;

            comparisonData.forEach(item => {
                const diff = item.compareValue - item.baseValue;
                const growthClass = item.growth >= 0 ? 'positive' : 'negative';
                
                compareHTML += `
                    <tr>
                        <td><strong>${item.store}</strong></td>
                        <td class="number">NT$ ${item.baseValue.toLocaleString()}</td>
                        <td class="number">NT$ ${item.compareValue.toLocaleString()}</td>
                        <td class="number ${growthClass}">NT$ ${diff.toLocaleString()}</td>
                        <td class="number ${growthClass}">${item.growth}%</td>
                    </tr>
                `;
            });

            compareHTML += `
                            </tbody>
                        </table>
                    </div>
                    <div class="scroll-hint">← 左右滑動查看更多 →</div>
                </div>
            `;

            document.getElementById('statsContainer').innerHTML = compareHTML;
            
            // 新增比較趨勢圖表（彙總所有店別）
            const baseSorted = [...baseData].sort((a, b) => a.完整日期.localeCompare(b.完整日期));
            const compareSorted = [...compareData].sort((a, b) => a.完整日期.localeCompare(b.完整日期));
            
            document.getElementById('chartsContainer').innerHTML = `
                <div class="charts-section fade-in" style="margin-top: 30px;">
                    <div class="chart-container">
                        <div class="chart-title">
                            <span>📈</span>
                            <span>全店每日總業績趨勢比較</span>
                        </div>
                        <canvas id="comparisonTrendChart" class="chart-canvas"></canvas>
                    </div>
                </div>
            `;
            
            createComparisonTrendChart(baseSorted, compareSorted, '全店');
            
            document.getElementById('tableContainer').innerHTML = '';
        }

        // 頁面載入時自動載入資料
        window.onload = function() {
            loadJSON();
        };
    </script>
</body>
</html>
